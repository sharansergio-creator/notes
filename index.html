<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#075E54">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Notes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#075E54}

#upload-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#f0f2f5;padding:32px}
.up-icon{font-size:64px;margin-bottom:20px}
.up-h{font-size:22px;font-weight:700;color:#111;margin-bottom:8px}
.up-s{font-size:14px;color:#667781;text-align:center;line-height:1.6;margin-bottom:36px;max-width:260px}
#ubtn{background:#075E54;color:#fff;border:none;padding:16px 32px;border-radius:28px;font-size:16px;font-weight:600;cursor:pointer;width:100%;max-width:260px}
#ubtn:active{opacity:.85}
#fi{display:none}
#uerr{color:#e53935;font-size:13px;margin-top:12px;text-align:center;display:none}

#loading-screen{display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#f0f2f5}
.ld-i{font-size:56px;margin-bottom:18px}
.ld-h{font-size:18px;font-weight:600;color:#111;margin-bottom:4px}
.ld-s{font-size:13px;color:#667781;margin-bottom:18px}
#lpct{font-size:34px;font-weight:700;color:#075E54;margin-bottom:10px}
#lbw{width:200px;height:5px;background:#e0e0e0;border-radius:3px;overflow:hidden}
#lb{height:100%;background:#25D366;border-radius:3px;width:0;transition:width .12s}

#chat-screen{display:none;flex-direction:column;height:100vh}
#nh,#sh{background:#075E54;height:56px;display:flex;align-items:center;padding:0 4px;gap:4px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.25)}
#sh{display:none}
#sh.on{display:flex}
.hb{background:none;border:none;color:#fff;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;flex-shrink:0;font-size:20px}
.hb:active{background:rgba(255,255,255,.18)}
#av{width:36px;height:36px;border-radius:50%;background:#128C7E;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;flex-shrink:0}
#hi{flex:1;min-width:0}
#hn{color:#fff;font-size:16px;font-weight:600}
#hs{color:rgba(255,255,255,.75);font-size:12px}
#si{flex:1;background:rgba(255,255,255,.15);border:none;border-radius:20px;color:#fff;font-size:15px;padding:8px 14px;outline:none;min-width:0}
#si::placeholder{color:rgba(255,255,255,.6)}
#scbar{background:#128C7E;color:#fff;font-size:12px;padding:4px 14px;flex-shrink:0;display:none}

#vp{flex:1;overflow-y:auto;background:#ece5dd;-webkit-overflow-scrolling:touch;padding:6px 0 20px}
#vp::-webkit-scrollbar{display:none}

/* load more buttons */
.load-more{display:flex;justify-content:center;padding:10px}
.load-more button{background:rgba(0,0,0,.08);border:none;border-radius:16px;padding:8px 20px;font-size:13px;color:#555;cursor:pointer}
.load-more button:active{background:rgba(0,0,0,.15)}

.ds{display:flex;justify-content:center;padding:12px 8px 4px}
.dc{background:rgba(225,245,254,.93);color:#546e7a;font-size:12px;padding:5px 12px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:500}
.br{display:flex;margin-bottom:2px;padding:0 8px}
.br.r{justify-content:flex-end}
.br.l{justify-content:flex-start}
.b{max-width:78%;padding:6px 9px 4px;font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.b.r{background:#dcf8c6;border-radius:8px 2px 8px 8px;color:#111}
.b.r::after{content:'';position:absolute;top:0;right:-7px;width:0;height:0;border-left:8px solid #dcf8c6;border-bottom:8px solid transparent}
.b.l{background:#fff;border-radius:2px 8px 8px 8px;color:#111}
.b.l::before{content:'';position:absolute;top:0;left:-7px;width:0;height:0;border-right:8px solid #fff;border-bottom:8px solid transparent}
.bt{font-size:11px;color:#999;text-align:right;margin-top:3px;display:flex;align-items:center;justify-content:flex-end;gap:3px;line-height:1.2}
.tk{font-size:11px;color:#53bdeb}
.mi{color:#888;font-style:italic;font-size:13px}

#fab{position:fixed;right:14px;bottom:24px;width:46px;height:46px;border-radius:50%;background:#fff;border:none;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);display:none;align-items:center;justify-content:center;font-size:22px;color:#075E54;z-index:100}
#fab.on{display:flex}

#cmod{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.5);align-items:flex-end}
#cmod.on{display:flex}
#csheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:82vh;display:flex;flex-direction:column}
.sh2{width:36px;height:4px;background:#ddd;border-radius:2px;margin:10px auto 0;flex-shrink:0}
.chdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.chdr h3{font-size:17px;font-weight:700;color:#111}
.chdr button{background:none;border:none;font-size:26px;color:#aaa;cursor:pointer;padding:0 4px}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;flex-shrink:0}
.mnav button{background:none;border:none;font-size:28px;color:#075E54;cursor:pointer;padding:2px 12px;border-radius:8px;line-height:1}
.mnav button:active{background:#f0f0f0}
.mnav span{font-size:15px;font-weight:600;color:#111}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px 8px;gap:2px;flex-shrink:0}
.cdn{text-align:center;font-size:11px;color:#667781;font-weight:600;padding:4px 0}
.cd{text-align:center;font-size:13px;border-radius:50%;color:#ccc;width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.cd.hm{color:#075E54;font-weight:700;background:#e8f5e9;cursor:pointer}
.cd.hm:active{background:#c8e6c9}
.cd.td{border:2px solid #25D366}
.dl-t{font-size:11.5px;color:#667781;font-weight:600;padding:6px 20px 4px;text-transform:uppercase;letter-spacing:.5px;border-top:1px solid #f0f0f0;flex-shrink:0}
#dl{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.di{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.di:active{background:#f5f5f5}
.di-d{font-size:15px;color:#111;font-weight:500}
.di-w{font-size:12px;color:#667781;margin-top:2px}
.di-a{color:#ccc;font-size:20px;margin-left:auto;flex-shrink:0}
</style>
</head>
<body>

<div id="upload-screen">
  <div class="up-icon">💬</div>
  <div class="up-h">View Chat</div>
  <div class="up-s">Upload your WhatsApp exported .txt chat file</div>
  <button id="ubtn">📂 Choose File</button>
  <input id="fi" type="file" accept=".txt">
  <div id="uerr"></div>
</div>

<div id="loading-screen">
  <div class="ld-i">💬</div>
  <div class="ld-h">Loading memories</div>
  <div class="ld-s">Please wait...</div>
  <div id="lpct">0%</div>
  <div id="lbw"><div id="lb"></div></div>
</div>

<div id="chat-screen">
  <div id="nh">
    <button class="hb" id="bbtn">←</button>
    <div id="av">K</div>
    <div id="hi"><div id="hn">Kanna ❤️</div><div id="hs">loading...</div></div>
    <button class="hb" id="sbtn">🔍</button>
    <button class="hb" id="cbtn">📅</button>
  </div>
  <div id="sh">
    <button class="hb" id="sbbtn">←</button>
    <input id="si" type="search" placeholder="Search messages..." autocomplete="off" autocorrect="off" autocapitalize="off">
    <button class="hb" id="sxbtn" style="display:none">✕</button>
  </div>
  <div id="scbar"></div>
  <div id="vp"></div>
  <button id="fab">↓</button>
</div>

<div id="cmod">
  <div id="csheet" onclick="event.stopPropagation()">
    <div class="sh2"></div>
    <div class="chdr"><h3>Jump to Date</h3><button onclick="closeCal()">×</button></div>
    <div class="mnav">
      <button id="mprev">‹</button>
      <span id="mlbl"></span>
      <button id="mnext">›</button>
    </div>
    <div class="cgrid">
      <div class="cdn">S</div><div class="cdn">M</div><div class="cdn">T</div>
      <div class="cdn">W</div><div class="cdn">T</div><div class="cdn">F</div><div class="cdn">S</div>
      <div id="cdw" style="display:contents"></div>
    </div>
    <div class="dl-t">All Dates</div>
    <div id="dl"></div>
  </div>
</div>

<script>
'use strict';
const HER='.';
// Robust regex: date, time, dash, then ANYTHING up to first colon+space
const RE=/^(\d{1,2}\/\d{1,2}\/\d{2,4}),\s+(\d{1,2}:\d{2}(?::\d{2})?\s*(?:[aApP][mM])?)\s*[-\u2013\u2014]\s*([^:]+):\s(.+)$/;
// Detect lines that start with a timestamp (even if full parse fails)
const RE2=/^\d{1,2}\/\d{1,2}\/\d{2,4},\s+\d{1,2}:\d{2}/;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// State
let allMsgs=[], allDates=[], dateSet=new Set();
// msgsByDate: { "08/11/23": [msg, msg, ...] }
let msgsByDate={};
let db=null, srchTimer=null, isSearch=false;
let calY=new Date().getFullYear(), calM=new Date().getMonth();

// Pagination: which date indices are currently rendered
const PAGE=5; // render 5 days at a time
let startDateIdx=0, endDateIdx=0;

// ── DB ─────────────────────────────────────────────────────────────────────
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('KV7',1);r.onupgradeneeded=e=>e.target.result.createObjectStore('d');r.onsuccess=e=>{db=e.target.result;res()};r.onerror=rej})}
function dbtx(m){return db.transaction('d',m).objectStore('d')}
function dbGet(k){return new Promise(r=>{const q=dbtx('readonly').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
function dbSet(k,v){return new Promise(r=>{const q=dbtx('readwrite').put(v,k);q.onsuccess=r;q.onerror=r})}

function show(id){['upload-screen','loading-screen','chat-screen'].forEach(s=>$(s).style.display=s===id?'flex':'none')}
function setPct(p){$('lpct').textContent=p+'%';$('lb').style.width=p+'%'}

// ── Parser ─────────────────────────────────────────────────────────────────
async function processFile(text){
  show('loading-screen');setPct(5);
  const lines=text.split('\n');const N=lines.length;
  const msgs=[];let cur=null;
  for(let i=0;i<N;i++){
    const line=lines[i].trim();if(!line)continue;
    const m=line.match(RE);
    if(m){if(cur)msgs.push(cur);cur={date:m[1],time:m[2].trim(),sender:m[3].trim(),text:m[4].trim()}}
    else if(cur){
      // If line starts with a timestamp but full regex failed,
      // it's likely a system message or edge case — skip it
      if(RE2.test(line)){
        msgs.push(cur);
        cur=null; // skip this line
      } else {
        cur.text+='\n'+line;
      }
    }
    if(i%20000===0){setPct(5+Math.round((i/N)*60));await sleep(0)}
  }
  if(cur)msgs.push(cur);
  setPct(70);await sleep(0);
  await dbSet('msgs',msgs);await dbSet('ok',1);
  setPct(90);await sleep(0);
  initData(msgs);
  setPct(100);await sleep(60);
  show('chat-screen');
  // Start from last 5 days
  startDateIdx=Math.max(0,allDates.length-PAGE);
  endDateIdx=allDates.length-1;
  renderDateRange(startDateIdx,endDateIdx,false);
  scrollBottom();
}

// ── Init data ──────────────────────────────────────────────────────────────
function initData(msgs){
  allMsgs=msgs;
  msgsByDate={};
  const seen=new Set();allDates=[];dateSet=new Set();
  for(const m of msgs){
    if(!seen.has(m.date)){seen.add(m.date);allDates.push(m.date);dateSet.add(m.date)}
    if(!msgsByDate[m.date])msgsByDate[m.date]=[];
    msgsByDate[m.date].push(m);
  }
  $('hs').textContent=msgs.length.toLocaleString('en-IN')+' messages';
}

// ── Render helpers ─────────────────────────────────────────────────────────
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}
function isMedia(t){return /omitted|<attached>/i.test(t)}
function fmtChip(d){
  const p=d.split('/');if(p.length<3)return d;
  const[dd,mm,yy]=p;const yyyy=yy.length===2?'20'+yy:yy;
  const dt=new Date(+yyyy,+mm-1,+dd);if(isNaN(dt))return d;
  const t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(dt.toDateString()===t.toDateString())return'TODAY';
  if(dt.toDateString()===y.toDateString())return'YESTERDAY';
  return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}).toUpperCase();
}
function fmtDateFull(d){
  const p=d.split('/');if(p.length<3)return d;
  const[dd,mm,yy]=p;const yyyy=yy.length===2?'20'+yy:yy;
  const dt=new Date(+yyyy,+mm-1,+dd);if(isNaN(dt))return d;
  return dt.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

function msgsToHTML(msgs){
  let html='';
  for(const msg of msgs){
    const isHer=msg.sender===HER;
    const txt=isMedia(msg.text)?`<span class="mi">📎 ${esc(msg.text)}</span>`:esc(msg.text);
    const tks=isHer?'<span class="tk">✓✓</span>':'';
    html+=`<div class="br ${isHer?'r':'l'}"><div class="b ${isHer?'r':'l'}">${txt}<div class="bt">${msg.time}${tks}</div></div></div>`;
  }
  return html;
}

// Render a range of dates into #vp
// prepend=true means add to top, false means set as full content
function renderDateRange(fromIdx,toIdx,prepend){
  const vp=$('vp');
  let html='';

  // "Load earlier" button at top if more dates exist
  if(fromIdx>0){
    html+=`<div class="load-more"><button onclick="loadEarlier()">Load earlier messages</button></div>`;
  }

  for(let i=fromIdx;i<=toIdx;i++){
    const date=allDates[i];
    const msgs=msgsByDate[date]||[];
    html+=`<div class="ds" id="date-${i}"><span class="dc">${fmtChip(date)}</span></div>`;
    html+=msgsToHTML(msgs);
  }

  // "Load later" button at bottom if more dates exist
  if(toIdx<allDates.length-1){
    html+=`<div class="load-more"><button onclick="loadLater()">Load later messages</button></div>`;
  }

  vp.innerHTML=html;
}

function loadEarlier(){
  const newStart=Math.max(0,startDateIdx-PAGE);
  startDateIdx=newStart;
  const scrollH=$('vp').scrollHeight;
  renderDateRange(startDateIdx,endDateIdx,false);
  // Restore scroll position so page doesn't jump
  const newScrollH=$('vp').scrollHeight;
  $('vp').scrollTop=newScrollH-scrollH;
}

function loadLater(){
  endDateIdx=Math.min(allDates.length-1,endDateIdx+PAGE);
  const st=$('vp').scrollTop;
  renderDateRange(startDateIdx,endDateIdx,false);
  $('vp').scrollTop=st;
}

// ── Jump to date — renders that date's window and scrolls to it ───────────
function jumpToDate(dateStr){
  closeCal();
  if(isSearch)closeSearch();

  const idx=allDates.indexOf(dateStr);
  if(idx===-1)return;

  // Render a window of PAGE days centered on target
  startDateIdx=Math.max(0,idx-2);
  endDateIdx=Math.min(allDates.length-1,startDateIdx+PAGE-1);
  renderDateRange(startDateIdx,endDateIdx,false);

  // Scroll to the date separator
  setTimeout(()=>{
    const el=document.getElementById('date-'+(idx));
    if(el){
      $('vp').scrollTop=el.offsetTop-6;
    }
  },50);
}

function scrollBottom(){
  // Make sure last dates are rendered
  startDateIdx=Math.max(0,allDates.length-PAGE);
  endDateIdx=allDates.length-1;
  renderDateRange(startDateIdx,endDateIdx,false);
  setTimeout(()=>{ $('vp').scrollTop=$('vp').scrollHeight; },50);
}

// ── Search — renders matching msgs directly, no pagination ────────────────
function openSearch(){
  isSearch=true;
  $('nh').style.display='none';
  $('sh').classList.add('on');
  $('si').focus();
}
function closeSearch(){
  isSearch=false;
  $('nh').style.display='flex';
  $('sh').classList.remove('on');
  $('si').value='';
  $('sxbtn').style.display='none';
  $('scbar').style.display='none';
  // Restore normal view
  renderDateRange(startDateIdx,endDateIdx,false);
}

$('si').addEventListener('input',function(){
  clearTimeout(srchTimer);
  const val=this.value.trim();
  $('sxbtn').style.display=val?'flex':'none';
  srchTimer=setTimeout(()=>{
    if(!val){
      $('scbar').style.display='none';
      renderDateRange(startDateIdx,endDateIdx,false);
      return;
    }
    const q=val.toLowerCase();
    const matched=allMsgs.filter(m=>m.text.toLowerCase().includes(q));
    $('scbar').textContent=matched.length.toLocaleString('en-IN')+' results';
    $('scbar').style.display='block';
    // Render search results directly
    const vp=$('vp');
    let html='';
    if(!matched.length){
      vp.innerHTML='<div style="text-align:center;padding:40px 20px;color:#888;font-size:14px">No messages found</div>';
      return;
    }
    let lastDate='';
    for(const msg of matched){
      if(msg.date!==lastDate){
        lastDate=msg.date;
        html+=`<div class="ds"><span class="dc">${fmtChip(msg.date)}</span></div>`;
      }
      const isHer=msg.sender===HER;
      const txt=isMedia(msg.text)?`<span class="mi">📎 ${esc(msg.text)}</span>`:esc(msg.text);
      const tks=isHer?'<span class="tk">✓✓</span>':'';
      html+=`<div class="br ${isHer?'r':'l'}"><div class="b ${isHer?'r':'l'}">${txt}<div class="bt">${msg.time}${tks}</div></div></div>`;
    }
    vp.innerHTML=html;
  },400);
});

// ── FAB ───────────────────────────────────────────────────────────────────
$('vp').addEventListener('scroll',function(){
  const near=this.scrollTop+this.clientHeight>=this.scrollHeight-150;
  $('fab').classList.toggle('on',!near);
},{passive:true});

// ── Calendar ───────────────────────────────────────────────────────────────
function parseDStr(d){
  const p=d.split('/');if(p.length<3)return null;
  const[dd,mm,yy]=p;const yyyy=yy.length===2?'20'+yy:yy;
  return new Date(+yyyy,+mm-1,+dd);
}
function buildCal(){
  $('mlbl').textContent=MONTHS[calM]+' '+calY;
  const first=new Date(calY,calM,1).getDay();
  const days=new Date(calY,calM+1,0).getDate();
  const today=new Date();
  let html='';
  for(let i=0;i<first;i++)html+='<div class="cd"></div>';
  for(let d=1;d<=days;d++){
    const dd=String(d).padStart(2,'0');
    const mm=String(calM+1).padStart(2,'0');
    const yy=String(calY).slice(2);
    const ds=`${dd}/${mm}/${yy}`;
    const hm=dateSet.has(ds);
    const isTd=new Date(calY,calM,d).toDateString()===today.toDateString();
    html+=`<div class="cd${hm?' hm':''}${isTd?' td':''}"${hm?` onclick="jumpToDate('${ds}')"`:''}>${d}</div>`;
  }
  $('cdw').innerHTML=html;
}
function buildDL(){
  $('dl').innerHTML=allDates.map(d=>{
    const dt=parseDStr(d);
    const dl=dt?dt.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}):d;
    const dw=dt?dt.toLocaleDateString('en-IN',{weekday:'long'}):'';
    return`<div class="di" onclick="jumpToDate('${d}')"><div><div class="di-d">${dl}</div><div class="di-w">${dw}</div></div><span class="di-a">›</span></div>`;
  }).join('');
}
function openCal(){buildCal();buildDL();$('cmod').classList.add('on')}
function closeCal(){$('cmod').classList.remove('on')}

// ── Wire ───────────────────────────────────────────────────────────────────
$('ubtn').onclick=()=>$('fi').click();
$('fi').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('uerr').style.display='none';
  try{await processFile(await f.text())}
  catch(err){$('uerr').textContent='Error reading file.';$('uerr').style.display='block';show('upload-screen')}
  e.target.value='';
};
$('bbtn').onclick=()=>{if(confirm('Go back? Your chat stays saved.'))show('upload-screen')};
$('sbtn').onclick=openSearch;
$('cbtn').onclick=openCal;
$('sbbtn').onclick=closeSearch;
$('sxbtn').onclick=()=>{$('si').value='';$('si').dispatchEvent(new Event('input'));$('si').focus()};
$('fab').onclick=scrollBottom;
$('mprev').onclick=()=>{calM--;if(calM<0){calM=11;calY--}buildCal()};
$('mnext').onclick=()=>{calM++;if(calM>11){calM=0;calY++}buildCal()};
$('cmod').onclick=e=>{if(e.target===$('cmod'))closeCal()};

window.addEventListener('popstate',()=>{
  if($('cmod').classList.contains('on')){closeCal();history.pushState(null,'');return}
  if(isSearch){closeSearch();history.pushState(null,'')}
});
history.pushState(null,'');

// ── Init ───────────────────────────────────────────────────────────────────
async function init(){
  try{['KanimaaDB','KanimaaDB2','KanimaaV3','KV4','KV5','KV6'].forEach(n=>{try{indexedDB.deleteDatabase(n)}catch(e){}})}catch(e){}
  try{await openDB()}catch(e){show('upload-screen');return}
  const ok=await dbGet('ok');
  if(ok){
    const msgs=await dbGet('msgs');
    if(msgs&&msgs.length){
      show('loading-screen');setPct(50);
      initData(msgs);
      setPct(100);await sleep(60);
      show('chat-screen');
      startDateIdx=Math.max(0,allDates.length-PAGE);
      endDateIdx=allDates.length-1;
      renderDateRange(startDateIdx,endDateIdx,false);
      setTimeout(()=>{ $('vp').scrollTop=$('vp').scrollHeight; },100);
      return;
    }
  }
  show('upload-screen');
}
init();
</script>
